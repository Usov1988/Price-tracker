name: Price Checker Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Выберите категорию 21vek'
        required: true
        default: 'mobile'
        type: choice
        options:
          - mobile
          - televisions
          - refrigerators
          - laptops

jobs:
  run-parser:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          CATEGORY: ${{ github.event.inputs.category }}
        run: python parser.py

      - name: Auto commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update prices.json [skip ci]"
          file_pattern: "prices.json"
          
