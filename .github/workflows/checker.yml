name: Price Checker Bot

on:
  schedule:
    # Запускать скрипт каждые 2 часа (можно изменить при желании)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Позволяет запускать вручную кнопкой с сайта GitHub

permissions:
  contents: write

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python parser.py

      - name: Commit and push changes if prices updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update prices.json [skip ci]" && git push)
