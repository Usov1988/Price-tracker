<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор аномальных цен</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 20px;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f0f6fc;
        }
        .subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 15px;
        }
        /* Панель управления */
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            background: #21262d;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #30363d;
        }
        select, button {
            padding: 6px 12px;
            background: #30363d;
            color: #c9d1d9;
            border: 1px solid #484f58;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        select:focus, button:focus {
            border-color: #58a6ff;
        }
        button {
            background: #238636;
            color: #fff;
            border-color: #2ea043;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background: #2ea043;
        }
        #parserStatus {
            font-size: 13px;
            color: #8b949e;
            width: 100%;
            margin-top: 5px;
        }
        /* Таблица */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #30363d;
        }
        th {
            color: #8b949e;
            font-weight: 600;
            font-size: 13px;
        }
        .price-val {
            color: #f85149;
            font-weight: 500;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .links-cell {
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🔍 Монитор аномальных цен</h1>
        <div class="subtitle">Автоматическое сравнение цен 21vek с каталогом Onliner</div>

        <!-- Панель управления с сайта -->
        <div class="control-panel">
            <label for="categorySelect">Категория:</label>
            <select id="categorySelect">
                <option value="mobile">Смартфоны</option>
                <option value="televisions">Телевизоры</option>
                <option value="refrigerators">Холодильники</option>
                <option value="laptops">Ноутбуки</option>
            </select>
            <button onclick="triggerParser()">Запустить парсинг</button>
            <div id="parserStatus"></div>
        </div>

        <!-- Таблица результатов -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Цена 21vek</th>
                        <th>Рынок (Onliner)</th>
                        <th>Дата находки</th>
                        <th>Ссылки</th>
                    </tr>
                </thead>
                <tbody id="priceTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #8b949e;">Загрузка данных...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Загрузка и отрисовка данных из prices.json при открытии сайта
    async function loadPrices() {
        try {
            const response = await fetch('prices.json?' + new Date().getTime());
            if (!response.ok) throw new Error('Файл данных не найден');
            
            const data = await response.json();
            const tbody = document.getElementById('priceTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #8b949e;">Список товаров пуст</td></tr>';
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.title || '—'}</td>
                    <td class="price-val">${item.price_21vek || item.price || '—'}</td>
                    <td>${item.price_onliner || '—'}</td>
                    <td style="color: #8b949e; font-size: 13px;">${item.date || '—'}</td>
                    <td class="links-cell">
                        <a href="${item.link_21vek || '#'}" target="_blank">21vek</a> | 
                        <a href="${item.link_onliner || '#'}" target="_blank">Onliner</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            document.getElementById('priceTableBody').innerHTML = '<tr><td colspan="5" style="text-align: center; color: #f85149;">Ошибка загрузки prices.json</td></tr>';
        }
    }

    // Функция запуска GitHub Actions прямо с сайта
    async function triggerParser() {
        const category = document.getElementById('categorySelect').value;
        const statusText = document.getElementById('parserStatus');
        
        let token = localStorage.getItem('gh_token');
        if (!token) {
            token = prompt("Введите GitHub Personal Access Token (нужен с правом repo/workflow для запуска из браузера):");
            if (token) {
                localStorage.setItem('gh_token', token.trim());
            } else {
                statusText.innerText = "Ошибка: требуется токен для доступа к API GitHub.";
                return;
            }
        }

        statusText.innerText = "Отправка запроса на запуск...";

        const owner = "Usov1988";
        const repo = "Price-tracker";

        try {
            const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/checker.yml/dispatches`, {
                method: 'POST',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ref: 'main',
                    inputs: { category: category }
                })
            });

            if (response.status === 204) {
                statusText.innerText = "✅ Парсер запущен! Данные обновятся на странице через 20–30 секунд.";
                setTimeout(loadPrices, 15000); // Автообновление таблицы через 15 сек
            } else {
                statusText.innerText = "❌ Ошибка запуска. Токен недействителен или у него нет прав.";
                localStorage.removeItem('gh_token');
            }
        } catch (error) {
            statusText.innerText = "❌ Ошибка сети при обращении к GitHub API.";
        }
    }

    // Загружаем данные при старте страницы
    loadPrices();
</script>

</body>
</html>
